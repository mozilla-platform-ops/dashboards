    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        import "influxdata/influxdb/schema"

        all_hosts =
          schema.tagValues(
            bucket: "marlin-icinga2",
            tag: "hostname",
            predicate: (r) =>
              r._measurement == "hostalive" and
              r.hostname =~ /${host_re}/
          )
            |> rename(columns: {_value: "hostname"})
            |> map(fn: (r) => ({ hostname: r.hostname, worker_pool_id: "zzz-no-pool" }))

        pool_hosts =
          from(bucket: "marlin-icinga2")
            |> range(start: -7d)
            |> filter(fn: (r) => r._measurement == "nrpe")
            |> filter(fn: (r) => r.service == "Windows Worker Pool ID")
            |> filter(fn: (r) => r._field == "value")
            |> filter(fn: (r) => r.hostname =~ /${host_re}/)
            |> group(columns: ["hostname"])
            |> last()
            |> keep(columns: ["hostname", "_value"])
            |> rename(columns: {_value: "worker_pool_id"})

        union(tables: [all_hosts, pool_hosts])
          |> group(columns: ["hostname"])
          |> sort(columns: ["worker_pool_id"])
          |> limit(n: 1)
          |> filter(fn: (r) => r.worker_pool_id =~ /^(${worker_pool_id:regex})$/)
          |> group()
          |> sort(columns: ["worker_pool_id", "hostname"])
          |> rename(columns: {hostname: "_value"})
          |> keep(columns: ["_value"])
      includeAll: true
      label: Hostname
      multi: true
      name: hostname
      options: []
      query:
        query: |-
          import "influxdata/influxdb/schema"

          all_hosts =
            schema.tagValues(
              bucket: "marlin-icinga2",
              tag: "hostname",
              predicate: (r) =>
                r._measurement == "hostalive" and
                r.hostname =~ /${host_re}/
