apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: bfib9xp9idu68b
  labels: {}
  name: windows-all-resource-v3
  namespace: default
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: -- Grafana --
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 0
  links: []
  panels:
  - gridPos:
      h: 2
      w: 24
      x: 0
      "y": 0
    id: 100
    options:
      code:
        language: plaintext
        showLineNumbers: false
        showMiniMap: false
      content: ""
      mode: markdown
    pluginVersion: 12.4.2
    title: Per-host status for Windows wintest workers — pool/host filters apply to
      all panels below
    transparent: true
    type: text
  - datasource:
      type: influxdb
      uid: afebxf3unvvggf
    description: |-
      Per-pool count of Windows workers (wintest) currently Available vs. Not Available, based on the Windows Generic Worker check state in the last 15 minutes.

      **Columns:**
      - **Pool** — worker pool ID from the `host_pool` InfluxDB measurement. Hosts without a pool record are bucketed as `Unknown`.
      - **Available (15 Minute Window)** — count of hosts whose Generic Worker check reported OK (state=0) at any point in the last 15 minutes.
      - **Not Available** — count of hosts whose Generic Worker check did NOT report OK in the last 15 minutes (warn/crit/unknown or no data).
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: false
          footer:
            reducers: []
          inspect: false
        mappings: []
        noValue: "0"
        thresholds:
          mode: absolute
          steps:
          - color: gray
            value: 0
      overrides:
      - matcher:
          id: byName
          options: pool
        properties:
        - id: displayName
          value: Pool
        - id: custom.width
          value: 320
      - matcher:
          id: byName
          options: Available
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: custom.align
          value: center
        - id: custom.wrapHeaderText
          value: true
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: green
              value: null
            - color: green
              value: 0
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: "0"
            type: special
        - id: displayName
          value: Available (15 Minute Window)
      - matcher:
          id: byName
          options: Not Available
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: custom.align
          value: center
        - id: custom.width
          value: 160
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: red
              value: 0
            - color: red
              value: 0
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: "0"
            type: special
    gridPos:
      h: 8
      w: 12
      x: 0
      "y": 2
    id: 500
    options:
      cellHeight: sm
      footer:
        fields:
        - Available
        - Not Available
        reducer:
        - sum
        show: true
      showHeader: true
      sortBy:
      - desc: false
        displayName: Pool
    pluginVersion: 12.4.2
    targets:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      query: |-
        hostFilter = (r) => r.hostname =~ /wintest/

        allHosts = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "hostalive" and r._field == "state")
          |> filter(fn: hostFilter)
          |> last()
          |> keep(columns: ["hostname"])
          |> group()
          |> distinct(column: "hostname")
          |> map(fn: (r) => ({hostname: r._value, k: "_anchor", v: ""}))

        poolRecords = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: hostFilter)
          |> last()
          |> map(fn: (r) => ({hostname: r.hostname, k: "pool", v: r._value}))

        gwAvailability = from(bucket: "marlin-icinga2")
          |> range(start: -15m)
          |> filter(fn: (r) => r._measurement == "nscp" and r.service == "Windows Generic Worker" and r._field == "state")
          |> filter(fn: hostFilter)
          |> group(columns: ["hostname"])
          |> min(column: "_value")
          |> map(fn: (r) => ({hostname: r.hostname, k: "gwAvail", v: if r._value == 0 then "yes" else "no"}))

        combined = union(tables: [allHosts, poolRecords, gwAvailability])
          |> group()
          |> pivot(rowKey: ["hostname"], columnKey: ["k"], valueColumn: "v")
          |> drop(columns: ["_anchor"])
          |> map(fn: (r) => ({
               hostname: r.hostname,
               pool: if exists r.pool then r.pool else "Unknown",
               gwAvail: if exists r.gwAvail then r.gwAvail else "no"
             }))

        available = combined
          |> filter(fn: (r) => r.gwAvail == "yes")
          |> group(columns: ["pool"])
          |> count(column: "hostname")
          |> map(fn: (r) => ({pool: r.pool, kind: "Available", n: r.hostname}))

        notAvailable = combined
          |> filter(fn: (r) => r.gwAvail != "yes")
          |> group(columns: ["pool"])
          |> count(column: "hostname")
          |> map(fn: (r) => ({pool: r.pool, kind: "Not Available", n: r.hostname}))

        union(tables: [available, notAvailable])
          |> group()
          |> pivot(rowKey: ["pool"], columnKey: ["kind"], valueColumn: "n")
          |> map(fn: (r) => ({
               pool: r.pool,
               Available: if exists r.Available then r.Available else 0,
               "Not Available": if exists r["Not Available"] then r["Not Available"] else 0
             }))
          |> sort(columns: ["pool"])
      refId: A
    title: Pool Summary
    transformations:
    - id: organize
      options:
        excludeByName: {}
        indexByName:
          Available: 1
          Not Available: 2
          pool: 0
        renameByName: {}
    type: table
  - datasource:
      type: prometheus
      uid: adpvtjmrxoc1sb
    description: |-
      Live queue depth and worker activity per Windows pool, sourced from Prometheus (`fxci_queue_*` metrics). Filtered to `provisionerId=releng-hardware`, `workerType=~.*win.*`, excluding win7.

      **Columns:**
      - **Pool** — worker pool ID derived from the Prometheus `workerType` label.
      - **Active** — `fxci_queue_running_workers`: current count of running workers.
      - **Queue** — `fxci_queue_pending_tasks`: current count of pending tasks.
      - **24h Peak** — `max_over_time(...[24h:])` of pending tasks; highest queue depth seen in the last 24 hours.
      - **Avg Task Age (min)** — estimated average age of currently-pending tasks (time spent waiting in the queue). Computed via Little's Law: `pending / rate(completed[1h]) / 60`. Steady-state proxy — we don't have per-task timestamps, so this is the expected wait under current throughput, not a true measurement. Idle pools (pending=0) show **0.0**; pools with a backlog but no completions in the last hour show —.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: false
          footer:
            reducers: []
          inspect: false
        mappings: []
        noValue: "0"
        thresholds:
          mode: absolute
          steps:
          - color: gray
            value: 0
      overrides:
      - matcher:
          id: byName
          options: pool
        properties:
        - id: displayName
          value: Pool
        - id: custom.width
          value: 320
      - matcher:
          id: byName
          options: Queue
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: custom.align
          value: center
        - id: custom.width
          value: 140
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: green
              value: 0
            - color: red
              value: 500
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: "0"
            type: special
      - matcher:
          id: byName
          options: Time
        properties: []
      - matcher:
          id: byName
          options: Active
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: custom.align
          value: center
        - id: custom.width
          value: 120
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: gray
              value: 0
            - color: green
              value: 1
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: "0"
            type: special
      - matcher:
          id: byName
          options: 24h Peak
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: custom.align
          value: center
        - id: custom.width
          value: 140
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: green
              value: 0
            - color: red
              value: 500
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: "0"
            type: special
      - matcher:
          id: byName
          options: Avg Task Age (min)
        properties:
        - id: custom.align
          value: center
        - id: custom.width
          value: 170
        - id: decimals
          value: 1
        - id: noValue
          value: —
        - id: mappings
          value:
          - options:
              match: "null"
              result:
                text: —
            type: special
    gridPos:
      h: 8
      w: 12
      x: 12
      "y": 2
    id: 510
    options:
      cellHeight: sm
      footer:
        fields:
        - Queue
        - Active
        reducer:
        - sum
        show: true
      showHeader: true
      sortBy:
      - desc: false
        displayName: Pool
    pluginVersion: 12.4.2
    targets:
    - datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      expr: sum by (pool) (label_replace(fxci_queue_pending_tasks{provisionerId="releng-hardware",
        workerType=~".*win.*", workerType!~".*win7.*"}, "pool", "$1", "workerType",
        "(.*)"))
      format: table
      instant: true
      range: false
      refId: A
    - datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      expr: sum by (pool) (label_replace(fxci_queue_running_workers{provisionerId="releng-hardware",
        workerType=~".*win.*", workerType!~".*win7.*"}, "pool", "$1", "workerType",
        "(.*)"))
      format: table
      instant: true
      range: false
      refId: B
    - datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      expr: max_over_time(sum by (pool) (label_replace(fxci_queue_pending_tasks{provisionerId="releng-hardware",
        workerType=~".*win.*", workerType!~".*win7.*"}, "pool", "$1", "workerType",
        "(.*)"))[24h:])
      format: table
      instant: true
      range: false
      refId: C
    - datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      expr: |-
        (
          sum by (pool) (label_replace(fxci_queue_pending_tasks{provisionerId="releng-hardware", workerType=~".*win.*", workerType!~".*win7.*"}, "pool", "$1", "workerType", "(.*)"))
          /
          (sum by (pool) (label_replace(rate(fxci_queue_completed_tasks{provisionerId="releng-hardware", workerType=~".*win.*", workerType!~".*win7.*"}[1h]), "pool", "$1", "workerType", "(.*)")) > 0)
          / 60
        )
        or
        sum by (pool) (label_replace(fxci_queue_pending_tasks{provisionerId="releng-hardware", workerType=~".*win.*", workerType!~".*win7.*"}, "pool", "$1", "workerType", "(.*)")) == 0
      format: table
      instant: true
      range: false
      refId: D
    title: Pool Queues
    transformations:
    - id: labelsToFields
      options:
        mode: columns
    - id: merge
      options: {}
    - id: joinByField
      options:
        byField: pool
        mode: outer
    - id: organize
      options:
        excludeByName:
          Time: true
          Time 1: true
          Time 2: true
          Time 3: true
          Time 4: true
        indexByName:
          'Value #A': 2
          'Value #B': 1
          'Value #C': 3
          'Value #D': 4
          pool: 0
        renameByName:
          'Value #A': Queue
          'Value #B': Active
          'Value #C': 24h Peak
          'Value #D': Avg Task Age (min)
    type: table
  - datasource:
      type: influxdb
      uid: afebxf3unvvggf
    description: |-
      Per-host status for pool **${pool}**. One row per Windows host expected to report (anchored on `hostalive` over the last 1h). Service columns show the worst state observed in the last 10 minutes. Grey ● = no data / host fell off the short window.

      **Columns:**
      - **Hostname** — FQDN of the Windows worker as Icinga reports it.
      - **Up** — `hostalive` state. Green=Up, Red=Down, Yellow=Unreachable, Grey=no data.
      - **Bootstrap** — `Windows Bootstrap Stage` (nrpe). Green=OK, Yellow=Warn, Red=Crit, Grey=Unknown/no data.
      - **Screen** — `Windows Screen` (nrpe). Green=OK, Yellow=Warn, Red=Crit, Grey=Unknown/no data.
      - **Generic Worker** — `Windows Generic Worker` (nscp). Green=OK (taking work), Yellow=Warn, Red=Crit, Grey=Unknown/no data.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: true
          footer:
            reducers: []
          inspect: false
        mappings: []
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides:
      - matcher:
          id: byName
          options: hostname
        properties:
        - id: displayName
          value: Hostname
        - id: custom.width
          value: 380
      - matcher:
          id: byName
          options: Up
        properties:
        - id: custom.cellOptions
          value:
            type: color-text
        - id: custom.align
          value: center
        - id: custom.width
          value: 60
        - id: mappings
          value:
          - options:
              "0":
                color: green
                text: ●
              "1":
                color: red
                text: ●
              "2":
                color: yellow
                text: ●
            type: value
          - options:
              match: "null"
              result:
                color: gray
                text: ●
            type: special
          - options:
              match: empty
              result:
                color: gray
                text: ●
            type: special
      - matcher:
          id: byName
          options: Bootstrap
        properties:
        - id: custom.cellOptions
          value:
            type: color-text
        - id: custom.align
          value: center
        - id: custom.width
          value: 90
        - id: mappings
          value:
          - options:
              "0":
                color: green
                text: ●
              "1":
                color: yellow
                text: ●
              "2":
                color: red
                text: ●
              "3":
                color: gray
                text: ●
            type: value
          - options:
              match: "null"
              result:
                color: gray
                text: ●
            type: special
          - options:
              match: empty
              result:
                color: gray
                text: ●
            type: special
      - matcher:
          id: byName
          options: Screen
        properties:
        - id: custom.cellOptions
          value:
            type: color-text
        - id: custom.align
          value: center
        - id: custom.width
          value: 70
        - id: mappings
          value:
          - options:
              "0":
                color: green
                text: ●
              "1":
                color: yellow
                text: ●
              "2":
                color: red
                text: ●
              "3":
                color: gray
                text: ●
            type: value
          - options:
              match: "null"
              result:
                color: gray
                text: ●
            type: special
          - options:
              match: empty
              result:
                color: gray
                text: ●
            type: special
      - matcher:
          id: byName
          options: Generic Worker
        properties:
        - id: custom.cellOptions
          value:
            type: color-text
        - id: custom.align
          value: center
        - id: custom.width
          value: 110
        - id: mappings
          value:
          - options:
              "0":
                color: green
                text: ●
              "1":
                color: yellow
                text: ●
              "2":
                color: red
                text: ●
              "3":
                color: gray
                text: ●
            type: value
          - options:
              match: "null"
              result:
                color: gray
                text: ●
            type: special
          - options:
              match: empty
              result:
                color: gray
                text: ●
            type: special
    gridPos:
      h: 12
      w: 24
      x: 0
      "y": 10
    id: 410
    maxPerRow: 2
    options:
      cellHeight: sm
      footer:
        show: false
      showHeader: true
      sortBy:
      - desc: false
        displayName: Hostname
    pluginVersion: 12.4.2
    repeat: pool
    repeatDirection: h
    targets:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      query: |-
        hostFilter = (r) => r.hostname =~ /wintest/

        expectedHosts = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "hostalive" and r._field == "state")
          |> filter(fn: hostFilter)
          |> last()
          |> keep(columns: ["hostname"])
          |> group()
          |> distinct(column: "hostname")
          |> map(fn: (r) => ({hostname: r._value, k: "_anchor", v: ""}))

        pool = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: hostFilter)
          |> last()
          |> map(fn: (r) => ({hostname: r.hostname, k: "Pool", v: r._value}))

        up = from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "hostalive" and r._field == "state")
          |> filter(fn: hostFilter)
          |> last()
          |> map(fn: (r) => ({hostname: r.hostname, k: "Up", v: string(v: r._value)}))

        mkService = (m, s, col) =>
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == m and r.service == s and r._field == "state")
            |> filter(fn: hostFilter)
            |> last()
            |> map(fn: (r) => ({hostname: r.hostname, k: col, v: string(v: r._value)}))

        mkServiceMin = (m, s, col) =>
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == m and r.service == s and r._field == "state")
            |> filter(fn: hostFilter)
            |> group(columns: ["hostname"])
            |> min(column: "_value")
            |> map(fn: (r) => ({hostname: r.hostname, k: col, v: string(v: r._value)}))

        bootstrap = mkServiceMin(m: "nrpe", s: "Windows Bootstrap Stage", col: "Bootstrap")
        screen = mkService(m: "nrpe", s: "Windows Screen", col: "Screen")
        gw = mkServiceMin(m: "nscp", s: "Windows Generic Worker", col: "Generic Worker")

        union(tables: [expectedHosts, pool, up, bootstrap, screen, gw])
          |> group()
          |> pivot(rowKey: ["hostname"], columnKey: ["k"], valueColumn: "v")
          |> drop(columns: ["_anchor"])
          |> map(fn: (r) => ({
               hostname: r.hostname,
               Pool: if exists r.Pool then r.Pool else "Unknown",
               Up: if exists r.Up then r.Up else "",
               Bootstrap: if exists r.Bootstrap then r.Bootstrap else "",
               Screen: if exists r.Screen then r.Screen else "",
               "Generic Worker": if exists r["Generic Worker"] then r["Generic Worker"] else ""
             }))
          |> filter(fn: (r) => r.Pool == "${pool}")
          |> filter(fn: (r) => r.hostname =~ /^${hostname:regex}$/)
          |> sort(columns: ["hostname"])
      refId: A
    title: ${pool}
    transformations:
    - id: organize
      options:
        excludeByName:
          Pool: true
        includeByName: {}
        indexByName:
          Bootstrap: 2
          Generic Worker: 4
          Screen: 3
          Up: 0
          hostname: 1
        renameByName: {}
    type: table
  preload: false
  schemaVersion: 42
  tags:
  - windows
  - wintest
  - status
  templating:
    list:
    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        import "experimental/array"

        actualPools = from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: (r) => r.hostname =~ /wintest/)
          |> last()
          |> group()
          |> distinct(column: "_value")
          |> keep(columns: ["_value"])
          |> map(fn: (r) => ({_value: r._value, sk: "0_" + r._value}))

        unknownRow = array.from(rows: [{_value: "Unknown", sk: "1_Unknown"}])

        union(tables: [actualPools, unknownRow])
          |> sort(columns: ["sk"])
          |> keep(columns: ["_value"])
      includeAll: true
      label: Pool
      multi: true
      name: pool
      options: []
      query:
        query: |-
          import "experimental/array"

          actualPools = from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
            |> filter(fn: (r) => r.hostname =~ /wintest/)
            |> last()
            |> group()
            |> distinct(column: "_value")
            |> keep(columns: ["_value"])
            |> map(fn: (r) => ({_value: r._value, sk: "0_" + r._value}))

          unknownRow = array.from(rows: [{_value: "Unknown", sk: "1_Unknown"}])

          union(tables: [actualPools, unknownRow])
            |> sort(columns: ["sk"])
            |> keep(columns: ["_value"])
        refId: Var-Pool
      refresh: 2
      regex: ""
      regexApplyTo: value
      type: query
    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: (r) => r.hostname =~ /wintest/)
          |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
          |> last()
          |> keep(columns: ["hostname"])
          |> group()
          |> distinct(column: "hostname")
          |> sort()
      includeAll: true
      label: Hostname
      multi: true
      name: hostname
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
            |> filter(fn: (r) => r.hostname =~ /wintest/)
            |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
            |> last()
            |> keep(columns: ["hostname"])
            |> group()
            |> distinct(column: "hostname")
            |> sort()
        refId: Var-Hostname
