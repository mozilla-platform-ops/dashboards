      datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      disableTextWrap: false
      editorMode: code
      expr: tc_queue2_prometheus_pending_tasks{provisioner="proj-autophone", workerType=~".*perf.*"}
