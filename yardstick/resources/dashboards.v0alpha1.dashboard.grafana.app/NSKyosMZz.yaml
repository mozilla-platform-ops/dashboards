      groupBy:
      - params:
        - queue
        type: tag
      hide: false
      includeNullMetadata: true
      legendFormat: '{{workerType}} pending tasks'
      measurement: current
      orderByTime: ASC
      policy: default
      query: |
        SELECT * FROM "bitbar_queue_size" WHERE $timeFilter and queue =~/perf/ GROUP BY "queue";
      range: true
      rawQuery: true
      refId: A
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
      tags:
      - key: queue
        operator: =
        value: gecko-t-ap-batt-g5
      useBackend: false
    - alias: $tag_queue
      datasource:
        type: prometheus
        uid: adpvtjmrxoc1sb
      disableTextWrap: false
      editorMode: code
      expr: sum by () (tc_queue2_prometheus_pending_tasks{provisioner="proj-autophone",
        workerType=~".*perf.*"})
      fullMetaSearch: false
      groupBy:
      - params:
        - queue
        type: tag
      hide: false
      includeNullMetadata: true
      legendFormat: total pending perf tasks
      measurement: current
      orderByTime: ASC
      policy: default
      query: |
        SELECT * FROM "bitbar_queue_size" WHERE $timeFilter and queue =~/perf/ GROUP BY "queue";
      range: true
      rawQuery: true
      refId: B
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
      tags:
      - key: queue
        operator: =
        value: gecko-t-ap-batt-g5
      useBackend: false
    title: Android Hardware (Bitbar) - Perf Queues
    type: timeseries
  - datasource:
      type: prometheus
      uid: adpvtjmrxoc1sb
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        mappings: []
        max: 3000
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: orange
            value: 800
          - color: red
            value: 1400
      overrides: []
    gridPos:
      h: 10
      w: 5
      x: 18
      "y": 0
    id: 9
    options:
      minVizHeight: 75
      minVizWidth: 75
      orientation: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ""
        values: false
      showThresholdLabels: true
      showThresholdMarkers: true
      sizing: auto
    pluginVersion: 11.5.4
    targets:
    - editorMode: code
      exemplar: false
      expr: sum by () (tc_queue2_prometheus_pending_tasks{provisioner="proj-autophone",
        workerType=~".*perf.*"})
      instant: false
      legendFormat: __auto
      range: true
      refId: A
    title: Current Android Hw Perf Jobs
    type: gauge
  preload: false
  refresh: 5m
  schemaVersion: 40
  tags:
  - android_main_alerts
  - android
  - owner=relsre
  - android_hw
  templating:
    list: []
  time:
    from: now-24h
    to: now
  timepicker: {}
  timezone: browser
  title: Android HW - Queues - Perf
  weekStart: ""
