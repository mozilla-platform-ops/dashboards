apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: edtgaia1z6waoe
  labels: {}
  name: NSKyosMZz
  namespace: default
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: datasource
        uid: grafana
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      target:
        limit: 100
        matchAny: false
        tags: []
        type: dashboard
      type: dashboard
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 0
  links: []
  panels:
  - datasource:
      type: prometheus
      uid: adpvtjmrxoc1sb
    description: proj-autophone/gecko-t-ap-*
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisCenteredZero: false
          axisColorMode: text
          axisLabel: jobs
          axisPlacement: auto
          barAlignment: 0
          barWidthFactor: 0.6
          drawStyle: line
          fillOpacity: 20
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineInterpolation: linear
          lineWidth: 1
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: never
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: line+area
        decimals: 0
        mappings: []
        thresholds:
          mode: absolute
          steps:
          - color: transparent
            value: null
        unit: none
      overrides: []
    gridPos:
      h: 10
      w: 18
      x: 0
      "y": 0
    id: 6
