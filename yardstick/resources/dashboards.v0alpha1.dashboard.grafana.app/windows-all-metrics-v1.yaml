apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: bfib9xp9idu68b
  labels: {}
  name: windows-all-metrics-v1
  namespace: default
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: -- Grafana --
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 0
  links: []
  panels:
  - gridPos:
      h: 2
      w: 24
      x: 0
      "y": 0
    id: 100
    options:
      code:
        language: plaintext
        showLineNumbers: false
        showMiniMap: false
      content: ""
      mode: markdown
    pluginVersion: 12.4.2
    title: Per-host CPU, thermal, memory, and disk timeseries for Windows wintest
      workers
    transparent: true
    type: text
  - collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      "y": 2
    id: 200
    panels:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      description: |-
        CPU utilization and thermal time series for host **${hostname}** (Windows). Two series on dual axes.

        **Series:**
        - **CPU 1m %** — `Windows CPU (1m avg)` (NSClient++). Left axis, 0–100%.
        - **Temp HP C** — `Windows Thermal (HighPrecision)` (NRPE), metric `temp_hp_c`. Right axis, °C.
      fieldConfig:
        defaults:
          color:
            mode: palette-classic
          custom:
            axisBorderShow: false
            axisCenteredZero: false
            axisColorMode: text
            axisLabel: ""
            axisPlacement: auto
            barAlignment: 0
            barWidthFactor: 0.6
            drawStyle: line
            fillOpacity: 0
            gradientMode: none
            hideFrom:
              legend: false
              tooltip: false
              viz: false
            insertNulls: false
            lineInterpolation: linear
            lineWidth: 1
            pointSize: 4
            scaleDistribution:
              type: linear
            showPoints: auto
            spanNulls: true
            stacking:
              group: A
              mode: none
            thresholdsStyle:
              mode: "off"
          displayName: ${__field.labels.series}
          mappings: []
          thresholds:
            mode: "off"
            steps:
            - color: green
              value: 0
        overrides:
        - matcher:
            id: byRegexp
            options: ^CPU 1m %$
          properties:
          - id: unit
            value: percent
          - id: min
            value: 0
          - id: max
            value: 100
          - id: custom.axisPlacement
            value: left
          - id: custom.axisLabel
            value: CPU %
          - id: custom.lineWidth
            value: 2
          - id: custom.showPoints
            value: never
        - matcher:
            id: byRegexp
            options: ^Temp HP C$
          properties:
          - id: unit
            value: celsius
          - id: custom.axisPlacement
            value: right
          - id: custom.axisLabel
            value: Temp °C
      gridPos:
        h: 10
        w: 12
        x: 0
        "y": 3
      id: 201
      options:
        legend:
          calcs:
          - lastNotNull
          - max
          - mean
          displayMode: table
          placement: bottom
          showLegend: true
        tooltip:
          hideZeros: false
          mode: multi
          sort: desc
      pluginVersion: 12.4.2
      targets:
      - datasource:
          type: influxdb
          uid: afebxf3unvvggf
        query: |-
          cpu_1m = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "nscp" and r.service == "Windows CPU (1m avg)" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "CPU 1m %" }))

          temp_hp = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "nrpe" and r.service == "Windows Thermal (HighPrecision)" and r.metric == "temp_hp_c" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "Temp HP C" }))

          union(tables: [cpu_1m, temp_hp])
            |> group(columns: ["series"])
            |> sort(columns: ["_time"])
        refId: A
      title: CPU and Thermal
      type: timeseries
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      description: |-
        Memory and disk usage time series for host **${hostname}** (Windows), bytes (decimal).

        **Series:**
        - **RAM Used** — `Windows RAM` (NSClient++), bytes used.
        - **Disk Used** — `Windows Disk` (NSClient++), bytes used.
      fieldConfig:
        defaults:
          color:
            mode: palette-classic
          custom:
            axisBorderShow: false
            axisCenteredZero: false
            axisColorMode: text
            axisLabel: Bytes
            axisPlacement: left
            barAlignment: 0
            barWidthFactor: 0.6
            drawStyle: line
            fillOpacity: 10
            gradientMode: none
            hideFrom:
              legend: false
              tooltip: false
              viz: false
            insertNulls: false
            lineInterpolation: linear
            lineWidth: 2
            pointSize: 4
            scaleDistribution:
              type: linear
            showPoints: never
            spanNulls: true
            stacking:
              group: A
              mode: none
            thresholdsStyle:
              mode: "off"
          displayName: ${__field.labels.series}
          mappings: []
          thresholds:
            mode: "off"
            steps:
            - color: green
              value: 0
          unit: decbytes
        overrides: []
      gridPos:
        h: 10
        w: 12
        x: 12
        "y": 3
      id: 202
      options:
        legend:
          calcs:
          - lastNotNull
          - max
          - mean
          displayMode: table
          placement: bottom
          showLegend: true
        tooltip:
          hideZeros: false
          mode: multi
          sort: desc
      pluginVersion: 12.4.2
      targets:
      - datasource:
          type: influxdb
          uid: afebxf3unvvggf
        query: |-
          ram = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "nscp" and r.service == "Windows RAM" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "RAM Used" }))

          disk = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "nscp" and r.service == "Windows Disk" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "Disk Used" }))

          union(tables: [ram, disk])
            |> group(columns: ["series"])
            |> sort(columns: ["_time"])
        refId: A
      title: Memory and Disk
      type: timeseries
    repeat: hostname
    title: ${hostname}
    type: row
  preload: false
  schemaVersion: 42
  tags:
  - windows
  - wintest
  - metrics
  - cpu
  - ram
  - disk
  - thermal
  templating:
    list:
    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> last()
          |> group()
          |> distinct(column: "_value")
          |> sort()
      includeAll: true
      label: Pool
      multi: true
      name: pool
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
            |> last()
            |> group()
            |> distinct(column: "_value")
            |> sort()
        refId: Var-Pool
      refresh: 2
      regex: ""
      regexApplyTo: value
      type: query
    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
          |> last()
          |> keep(columns: ["hostname"])
          |> group()
          |> distinct(column: "hostname")
          |> sort()
      includeAll: true
      label: Hostname
      multi: true
      name: hostname
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
            |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
            |> last()
            |> keep(columns: ["hostname"])
            |> group()
            |> distinct(column: "hostname")
            |> sort()
        refId: Var-Hostname
      refresh: 2
      regex: ""
      regexApplyTo: value
      type: query
  time:
    from: now-6h
    to: now
  timepicker: {}
  timezone: browser
  title: Windows All Metrics
  weekStart: ""
