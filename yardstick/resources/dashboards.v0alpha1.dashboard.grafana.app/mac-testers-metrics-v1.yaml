apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: cfm3q22tcfpq8a
  labels: {}
  name: mac-testers-metrics-v1
  namespace: default
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: -- Grafana --
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  panels:
  - gridPos:
      h: 2
      w: 24
      x: 0
      "y": 0
    id: 100
    options:
      content: ""
      mode: markdown
    title: Per-host CPU, memory, disk, and network latency timeseries for Mac tester
      workers
    transparent: true
    type: text
  - collapsed: true
    gridPos:
      h: 1
      w: 24
      x: 0
      "y": 2
    id: 200
    panels:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      description: |-
        CPU utilization for host **${hostname}** (macOS). Single series, 0–100%.

        **Series:**
        - **CPU %** — `snmp-load-average` check, metric `cpu_prct_used`.
      fieldConfig:
        defaults:
          color:
            mode: palette-classic
          custom:
            axisBorderShow: false
            axisCenteredZero: false
            axisColorMode: text
            axisLabel: CPU %
            axisPlacement: left
            barAlignment: 0
            barWidthFactor: 0.6
            drawStyle: line
            fillOpacity: 10
            gradientMode: none
            hideFrom:
              legend: false
              tooltip: false
              viz: false
            insertNulls: false
            lineInterpolation: linear
            lineWidth: 2
            pointSize: 4
            scaleDistribution:
              type: linear
            showPoints: never
            spanNulls: true
            stacking:
              group: A
              mode: none
            thresholdsStyle:
              mode: "off"
          displayName: ${__field.labels.series}
          mappings: []
          max: 100
          min: 0
          thresholds:
            mode: "off"
            steps:
            - color: green
              value: 0
          unit: percent
        overrides: []
      gridPos:
        h: 10
        w: 8
        x: 0
        "y": 3
      id: 201
      options:
        legend:
          calcs:
          - lastNotNull
          - max
          - mean
          displayMode: table
          placement: bottom
          showLegend: true
        tooltip:
          hideZeros: false
          mode: multi
          sort: desc
      pluginVersion: 12.4.2
      targets:
      - datasource:
          type: influxdb
          uid: afebxf3unvvggf
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "snmp-load" and r.service == "snmp-load-average" and r.metric == "cpu_prct_used" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "CPU %" }))
            |> group(columns: ["series"])
            |> sort(columns: ["_time"])
        refId: A
      title: CPU
      type: timeseries
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      description: |-
        Memory and disk usage for host **${hostname}** (macOS). Bytes (decimal).

        **Series:**
        - **RAM Used** — `snmp-memory-usage`, metric `ram_used` (KB → bytes).
        - **Swap Used** — `snmp-memory-usage`, metric `swap_used` (KB → bytes).
        - **Disk <metric>** — `snmp-disk` (measurement `snmp-storage`); one series per disk metric tag (e.g., `used`, `total`).
      fieldConfig:
        defaults:
          color:
            mode: palette-classic
          custom:
            axisBorderShow: false
            axisCenteredZero: false
            axisColorMode: text
            axisLabel: Bytes
            axisPlacement: left
            barAlignment: 0
            barWidthFactor: 0.6
            drawStyle: line
            fillOpacity: 10
            gradientMode: none
            hideFrom:
              legend: false
              tooltip: false
              viz: false
            insertNulls: false
            lineInterpolation: linear
            lineWidth: 2
            pointSize: 4
            scaleDistribution:
              type: linear
            showPoints: never
            spanNulls: true
            stacking:
              group: A
              mode: none
            thresholdsStyle:
              mode: "off"
          displayName: ${__field.labels.series}
          mappings: []
          thresholds:
            mode: "off"
            steps:
            - color: green
              value: 0
          unit: decbytes
        overrides: []
      gridPos:
        h: 10
        w: 8
        x: 8
        "y": 3
      id: 202
      options:
        legend:
          calcs:
          - lastNotNull
          - max
          - mean
          displayMode: table
          placement: bottom
          showLegend: true
        tooltip:
          hideZeros: false
          mode: multi
          sort: desc
      pluginVersion: 12.4.2
      targets:
      - datasource:
          type: influxdb
          uid: afebxf3unvvggf
        query: |-
          ram = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "snmp-memory" and r.service == "snmp-memory-usage" and r.metric == "ram_used" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> map(fn: (r) => ({_time: r._time, _value: float(v: r._value) * 1024.0, series: "RAM Used"}))

          swap = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "snmp-memory" and r.service == "snmp-memory-usage" and r.metric == "swap_used" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> map(fn: (r) => ({_time: r._time, _value: float(v: r._value) * 1024.0, series: "Swap Used"}))

          disk = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "snmp-storage" and r.service == "snmp-disk" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> map(fn: (r) => ({_time: r._time, _value: float(v: r._value), series: "Disk " + r.metric}))

          union(tables: [ram, swap, disk])
            |> group(columns: ["series"])
            |> sort(columns: ["_time"])
        refId: A
      title: Memory and Disk
      type: timeseries
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      description: |-
        Network round-trip and SSH connection time for host **${hostname}** (macOS), milliseconds.

        **Series:**
        - **Ping RTA** — `hostalive` ping round-trip time (ms).
        - **SSH Time** — `ssh` check connection time (scaled to ms).
      fieldConfig:
        defaults:
          color:
            mode: palette-classic
          custom:
            axisBorderShow: false
            axisCenteredZero: false
            axisColorMode: text
            axisLabel: Milliseconds
            axisPlacement: left
            barAlignment: 0
            barWidthFactor: 0.6
            drawStyle: line
            fillOpacity: 0
            gradientMode: none
            hideFrom:
              legend: false
              tooltip: false
              viz: false
            insertNulls: false
            lineInterpolation: linear
            lineWidth: 2
            pointSize: 4
            scaleDistribution:
              type: linear
            showPoints: never
            spanNulls: true
            stacking:
              group: A
              mode: none
            thresholdsStyle:
              mode: "off"
          displayName: ${__field.labels.series}
          mappings: []
          thresholds:
            mode: "off"
            steps:
            - color: green
              value: 0
          unit: ms
        overrides: []
      gridPos:
        h: 10
        w: 8
        x: 16
        "y": 3
      id: 203
      options:
        legend:
          calcs:
          - lastNotNull
          - max
          - mean
          displayMode: table
          placement: bottom
          showLegend: true
        tooltip:
          hideZeros: false
          mode: multi
          sort: desc
      pluginVersion: 12.4.2
      targets:
      - datasource:
          type: influxdb
          uid: afebxf3unvvggf
        query: |-
          rta = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "hostalive" and r.metric == "rta" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value), series: "Ping RTA" }))

          sshTime = from(bucket: "marlin-icinga2")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "ssh" and r.service == "ssh" and r.metric == "time" and r._field == "value")
            |> filter(fn: (r) => r.hostname == "${hostname}")
            |> keep(columns: ["_time", "_value"])
            |> map(fn: (r) => ({ r with _value: float(v: r._value) * 1000.0, series: "SSH Time" }))

          union(tables: [rta, sshTime])
            |> group(columns: ["series"])
            |> sort(columns: ["_time"])
        refId: A
      title: Network Latency
      type: timeseries
    repeat: hostname
    repeatDirection: v
    title: ${hostname}
    type: row
  schemaVersion: 42
  tags:
  - mac
  - macos
  - metrics
  - cpu
  - ram
  - disk
  - testers
  templating:
    list:
    - allValue: .*
      current:
        selected: true
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /^macmini-/)
          |> filter(fn: (r) => r._value =~ /-t-/)
          |> last()
          |> group()
          |> distinct(column: "_value")
          |> sort()
      includeAll: true
      label: Pool
      multi: true
      name: pool
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /^macmini-/)
            |> filter(fn: (r) => r._value =~ /-t-/)
            |> last()
            |> group()
            |> distinct(column: "_value")
            |> sort()
        refId: Var-Pool
      refresh: 2
      regex: ""
      type: query
    - allValue: .*
      current:
        selected: true
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /^macmini-/)
          |> filter(fn: (r) => r._value =~ /-t-/)
          |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
          |> last()
          |> keep(columns: ["hostname"])
          |> group()
          |> distinct(column: "hostname")
          |> sort()
      includeAll: true
      label: Hostname
      multi: true
      name: hostname
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /^macmini-/)
            |> filter(fn: (r) => r._value =~ /-t-/)
            |> filter(fn: (r) => r._value =~ /^${pool:regex}$/)
            |> last()
            |> keep(columns: ["hostname"])
            |> group()
            |> distinct(column: "hostname")
            |> sort()
        refId: Var-Hostname
      refresh: 2
      regex: ""
      type: query
  time:
    from: now-6h
    to: now
  timepicker: {}
  timezone: browser
  title: Mac Testers Metrics
