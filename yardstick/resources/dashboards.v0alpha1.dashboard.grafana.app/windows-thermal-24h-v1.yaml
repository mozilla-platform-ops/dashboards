apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: bfib9xp9idu68b
  labels: {}
  name: windows-thermal-24h-v1
  namespace: default
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: -- Grafana --
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 0
  links: []
  panels:
  - gridPos:
      h: 2
      w: 24
      x: 0
      "y": 0
    id: 100
    options:
      code:
        language: plaintext
        showLineNumbers: false
        showMiniMap: false
      content: ""
      mode: markdown
    pluginVersion: 12.4.2
    title: Windows wintest hosts that hit ≥ 98°C in the last 24 hours, grouped by
      pool
    transparent: true
    type: text
  - collapsed: false
    gridPos:
      h: 1
      w: 24
      x: 0
      "y": 2
    id: 200
    panels: []
    repeat: pool
    title: ${pool}
    type: row
  - datasource:
      type: influxdb
      uid: afebxf3unvvggf
    description: |-
      Count of Windows wintest hosts in pool **${pool}** that hit ≥ 98°C (high-precision thermal) at any point in the dashboard time range (default last 24h). Color: Green=0, Orange=1–9, Red=10+.

      Data source: `Windows Thermal (HighPrecision)` NRPE check, metric `temp_hp_c`. Pool membership joined from the `host_pool` measurement.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        mappings: []
        noValue: "0"
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
          - color: orange
            value: 1
          - color: red
            value: 10
        unit: none
      overrides: []
    gridPos:
      h: 3
      w: 24
      x: 0
      "y": 3
    id: 202
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: horizontal
      percentChangeColorMode: standard
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ""
        values: false
      showPercentChange: false
      textMode: value
      wideLayout: true
    pluginVersion: 12.4.2
    targets:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      query: |-
        hostFilter = (r) => r.hostname =~ /wintest/

        hot = from(bucket: "marlin-icinga2")
          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
          |> filter(fn: (r) => r._measurement == "nrpe" and r.service == "Windows Thermal (HighPrecision)" and r.metric == "temp_hp_c" and r._field == "value")
          |> filter(fn: hostFilter)
          |> group(columns: ["hostname"])
          |> max()
          |> filter(fn: (r) => float(v: r._value) >= 98.0)
          |> keep(columns: ["hostname", "_value"])

        poolHosts = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: hostFilter)
          |> filter(fn: (r) => r._value == "${pool}")
          |> last()
          |> keep(columns: ["hostname"])

        join(tables: {h: hot, p: poolHosts}, on: ["hostname"])
          |> group()
          |> count(column: "hostname")
          |> map(fn: (r) => ({_value: r.hostname}))
      refId: A
    title: Hosts ≥ 98°C in ${pool}
    type: stat
  - datasource:
      type: influxdb
      uid: afebxf3unvvggf
    description: |-
      Wintest hosts in pool **${pool}** that reached ≥ 98°C in the dashboard time range (default last 24h). Sorted by Max °C descending.

      **Columns:**
      - **Hostname** — FQDN of the wintest host.
      - **Max °C** — peak temperature observed in the range. Color-graded: orange ≥ 0°C, red ≥ 100°C.
      - **Peak Time** — timestamp of the peak temperature reading (ISO).
      - **Pool** — hidden by the organize transformation; pool membership pulled from `host_pool`.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: true
          footer:
            reducers: []
          inspect: false
        mappings: []
        noValue: no hosts ≥ 98°C
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides:
      - matcher:
          id: byName
          options: hostname
        properties:
        - id: displayName
          value: Hostname
        - id: custom.width
          value: 420
      - matcher:
          id: byName
          options: MaxC
        properties:
        - id: displayName
          value: Max °C
        - id: unit
          value: celsius
        - id: decimals
          value: 1
        - id: custom.align
          value: right
        - id: custom.width
          value: 130
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background-solid
        - id: thresholds
          value:
            mode: absolute
            steps:
            - color: orange
              value: 0
            - color: red
              value: 100
      - matcher:
          id: byName
          options: PeakTime
        properties:
        - id: displayName
          value: Peak Time
        - id: unit
          value: dateTimeAsIso
        - id: custom.align
          value: left
        - id: custom.width
          value: 240
      - matcher:
          id: byName
          options: Pool
        properties: []
    gridPos:
      h: 10
      w: 24
      x: 0
      "y": 6
    id: 201
    options:
      cellHeight: sm
      footer:
        fields:
        - hostname
        reducer:
        - count
        show: true
      showHeader: true
      sortBy:
      - desc: true
        displayName: Max °C
    pluginVersion: 12.4.2
    targets:
    - datasource:
        type: influxdb
        uid: afebxf3unvvggf
      query: |-
        hostFilter = (r) => r.hostname =~ /wintest/

        hot = from(bucket: "marlin-icinga2")
          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
          |> filter(fn: (r) => r._measurement == "nrpe" and r.service == "Windows Thermal (HighPrecision)" and r.metric == "temp_hp_c" and r._field == "value")
          |> filter(fn: hostFilter)
          |> group(columns: ["hostname"])
          |> max()
          |> filter(fn: (r) => float(v: r._value) >= 98.0)
          |> map(fn: (r) => ({hostname: r.hostname, MaxC: float(v: r._value), PeakTime: r._time}))
          |> keep(columns: ["hostname", "MaxC", "PeakTime"])

        pool = from(bucket: "marlin-icinga2")
          |> range(start: -1h)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool")
          |> filter(fn: hostFilter)
          |> filter(fn: (r) => r._value == "${pool}")
          |> last()
          |> map(fn: (r) => ({hostname: r.hostname, Pool: r._value}))
          |> keep(columns: ["hostname", "Pool"])

        join(tables: {h: hot, p: pool}, on: ["hostname"])
          |> group()
          |> sort(columns: ["MaxC"], desc: true)
      refId: A
    title: Hosts that hit ≥ 98°C
    transformations:
    - id: organize
      options:
        excludeByName:
          Pool: true
        includeByName: {}
        indexByName:
          MaxC: 1
          PeakTime: 2
          hostname: 0
        renameByName: {}
    type: table
  preload: false
  schemaVersion: 42
  tags:
  - windows
  - wintest
  - thermal
  - alert
  templating:
    list:
    - allValue: .*
      current:
        text: All
        value: $__all
      datasource:
        type: influxdb
        uid: afebxf3unvvggf
      definition: |-
        from(bucket: "marlin-icinga2")
          |> range(start: -10m)
          |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /wintest/)
          |> last()
          |> group()
          |> distinct(column: "_value")
          |> sort()
      includeAll: true
      label: Pool
      multi: true
      name: pool
      options: []
      query:
        query: |-
          from(bucket: "marlin-icinga2")
            |> range(start: -10m)
            |> filter(fn: (r) => r._measurement == "host_pool" and r._field == "pool" and r.hostname =~ /wintest/)
            |> last()
            |> group()
            |> distinct(column: "_value")
            |> sort()
        refId: Var-Pool
      refresh: 2
      regex: ""
      regexApplyTo: value
      type: query
  time:
    from: now-24h
    to: now
  timepicker: {}
  timezone: browser
  title: Windows Hosts ≥ 98°C (24h)
  weekStart: ""
